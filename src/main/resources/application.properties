spring.application.name=SDN_controller_app
server.port=8081

# ──────────────────────────────────────────────
# MQTT Broker (Mosquitto)
# Cambiar localhost por la IP LAN de tu laptop
# para que dispositivos externos se conecten.
# ──────────────────────────────────────────────
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=sdn-controller
mqtt.qos=1
mqtt.keep-alive=20
mqtt.connection-timeout=10

# ──────────────────────────────────────────────
# WiFi de alta velocidad (Carrier Switching)
# ──────────────────────────────────────────────
wifi.ssid=SDN_HIGH_SPEED
wifi.password=sdn_secure_pass

# ──────────────────────────────────────────────
# Umbral de decisión de canal
# ──────────────────────────────────────────────
carrier.file-size-threshold-mb=10

# ──────────────────────────────────────────────
# Jackson 3.x (REST) — excluir campos null
# ──────────────────────────────────────────────
spring.jackson.default-property-inclusion=non-null

# ──────────────────────────────────────────────
# Base de datos H2 (embebida, archivo local)
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/sdn_devices;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web H2 — accesible en http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
