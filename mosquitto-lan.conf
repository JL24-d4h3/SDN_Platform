# Configuración de Mosquitto para LAN
#
# Copiar este archivo a /etc/mosquitto/conf.d/lan.conf
# y reiniciar Mosquitto:
#   sudo cp mosquitto-lan.conf /etc/mosquitto/conf.d/lan.conf
#   sudo systemctl restart mosquitto
#
# Esto permite que dispositivos en tu red local (como tu celular)
# se conecten al broker MQTT de tu laptop.

# Escuchar en todas las interfaces de red (no solo localhost)
listener 1883 0.0.0.0

# Permitir conexiones sin autenticación (para desarrollo/pruebas)
allow_anonymous true

# Protocolo MQTT estándar
protocol mqtt
